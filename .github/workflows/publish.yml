name: Publish GitHub Pages

run-name: ${{ github.event_name == 'workflow_run' && format('Auto-publish Collect {0}', github.event.workflow_run.id) || format('Publish Collect {0}', github.event.inputs.collect_run_id) }}

# Manual dispatch remains the explicit fallback. Automated publication is
# event-driven from a successful scheduled Collect run and is bound to that
# run ID. This workflow never selects "the latest" candidate.

on:
  workflow_run:
    workflows: ["Collect"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to deploy the selected collect artifact
        required: true
        type: string
      collect_run_id:
        description: GitHub Actions run ID of a successful Collect workflow
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  note-ineligible-auto-publish:
    name: Note ineligible auto-publish
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'workflow_run' &&
      (
        github.event.workflow_run.conclusion != 'success' ||
        github.event.workflow_run.event != 'schedule' ||
        github.event.workflow_run.head_branch != 'main' ||
        github.event.workflow_run.name != 'Collect' ||
        github.event.workflow_run.head_repository.full_name != github.repository
      )
    steps:
      - name: Write trigger summary
        run: |
          {
            echo "## Auto-publish skipped"
            echo
            echo "- Collect run ID: \`${{ github.event.workflow_run.id }}\`"
            echo "- Collect event: \`${{ github.event.workflow_run.event }}\`"
            echo "- Conclusion: \`${{ github.event.workflow_run.conclusion }}\`"
            echo "- Branch: \`${{ github.event.workflow_run.head_branch }}\`"
            echo "- Head repository: \`${{ github.event.workflow_run.head_repository.full_name }}\`"
            echo
            echo "Automated publication only follows a successful scheduled Collect on main in this repository."
            echo "Manual Collect remains a candidate until Publish is dispatched with this run ID."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Pages artifact
    runs-on: ubuntu-24.04
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.event.inputs.confirm == 'PUBLISH'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.name == 'Collect' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
      reason: ${{ steps.decide.outputs.reason }}
      digest: ${{ steps.decide.outputs.digest }}
      snapshot_id: ${{ steps.decide.outputs.snapshot_id }}
      collect_run_id: ${{ steps.decide.outputs.collect_run_id }}
      status_publish: ${{ steps.decide.outputs.status_publish }}
    steps:
      - name: Checkout publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Checkout pulse-state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: pulse-state
          path: pulse-state
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify collect run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.collect_run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "${RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "collect_run_id must be a numeric GitHub Actions run id"
            exit 1
          fi
          gh api "repos/${REPO}/actions/runs/${RUN_ID}" > /tmp/collect-run.json
          gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" > /tmp/collect-artifacts.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path("/tmp/collect-run.json").read_text())
          expected = os.environ["RUN_ID"]
          if str(run.get("id")) != expected:
              raise SystemExit(f"Fetched run id {run.get('id')!r} is not {expected}")
          repo = (run.get("repository") or {}).get("full_name") if isinstance(run.get("repository"), dict) else None
          if repo and repo != os.environ["REPO"]:
              raise SystemExit(f"Collect run repository {repo!r} is not {os.environ['REPO']}")
          artifacts = json.loads(Path("/tmp/collect-artifacts.json").read_text())
          items = artifacts.get("artifacts") or []
          pulse = next((item for item in items if item.get("name") == "pulse-candidate"), None)
          Path("/tmp/collect-artifact.json").write_text(json.dumps(pulse or {}))
          print(json.dumps({"id": run.get("id"), "path": run.get("path"), "head_sha": run.get("head_sha"), "event": run.get("event"), "conclusion": run.get("conclusion")}, indent=2))
          PY

      - name: Download collect artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-candidate
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || github.event.inputs.collect_run_id }}

      - name: Decide publication
        id: decide
        env:
          PYTHONPATH: src
          REPO: ${{ github.repository }}
          PUBLISH_MODE: ${{ github.event_name == 'workflow_run' && 'auto' || 'manual' }}
          RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.collect_run_id }}
          EXPECTED_EVENT: ${{ github.event_name == 'workflow_run' && 'schedule' || '' }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # artifact.digest is the GitHub zip-archive SHA-256, not candidate.json.
          python -m silastron_pulse verify-artifact-dir --path dist
          python -m silastron_pulse decide-publication \
            --mode "${PUBLISH_MODE}" \
            --run-json /tmp/collect-run.json \
            --artifact-json /tmp/collect-artifact.json \
            --candidate dist/candidate.json \
            --metadata-json dist/candidate.meta.json \
            --sha256sums dist/SHA256SUMS \
            --kev-catalog dist/source-kev-catalog.json \
            --kev-meta dist/source-kev-meta.json \
            --published-dir pulse-state/published \
            --expected-repository "${REPO}" \
            --expected-branch main \
            --expected-run-id "${RUN_ID}" \
            --expected-event "${EXPECTED_EVENT}" \
            --expected-head-sha "${EXPECTED_HEAD_SHA}" \
            --artifact-dir dist \
            --verification-status-out dist/verification-status.json \
            --github-output "${GITHUB_OUTPUT}" \
            --summary-path "${GITHUB_STEP_SUMMARY}"

      - name: Promote snapshot into site data
        if: steps.decide.outputs.decision == 'publish'
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m silastron_pulse validate dist/candidate.json
          mkdir -p _site/data
          if [ -f pulse-state/published/latest.json ]; then
            python -m silastron_pulse safe-copy \
              --src pulse-state/published \
              --dst _site/data
          fi
          python -m silastron_pulse promote \
            --candidate dist/candidate.json \
            --published-dir _site/data \
            --expected-digest "${{ steps.decide.outputs.digest }}" \
            --expected-collector-sha "$(python -c 'import json; print(json.load(open("/tmp/collect-run.json"))["head_sha"])')"
          if [ -f dist/verification-status.json ]; then
            python -m silastron_pulse validate dist/verification-status.json
            cp dist/verification-status.json _site/data/verification-status.json
          fi
          cp preview/styles.css preview/app.js preview/theme.js _site/
          python -m silastron_pulse build-home-page --published-dir _site/data --template preview/index.html --site-dir _site
          python -m silastron_pulse build-static-cve-pages --published-dir _site/data --site-dir _site --base-url https://pulse.silastron.com
          python -m silastron_pulse validate _site/data/manifest.json
          python -m silastron_pulse validate _site/data/latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("_site/data/manifest.json").read_text())
          if manifest.get("status") not in {"ok", "degraded"}:
              raise SystemExit("Refusing to publish a non-ok snapshot")
          if not Path("_site/data/latest.json").exists():
              raise SystemExit("latest.json missing")
          PY

      - name: Build status-only site
        if: steps.decide.outputs.decision == 'skip' && steps.decide.outputs.status_publish == 'yes'
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          if [ ! -f pulse-state/published/latest.json ]; then
            echo "No published snapshot exists for status-only publication"
            exit 1
          fi
          python3 -m silastron_pulse verify-publication-status \
            --published-dir pulse-state/published \
            --require consistent
          python3 -m silastron_pulse validate dist/verification-status.json
          mkdir -p _site/data
          python3 -m silastron_pulse safe-copy \
            --src pulse-state/published \
            --dst _site/data
          python3 -m silastron_pulse build-catalog-index --published-dir _site/data
          cp dist/verification-status.json _site/data/verification-status.json
          cp preview/styles.css preview/app.js preview/theme.js _site/
          python3 -m silastron_pulse build-home-page --published-dir _site/data --template preview/index.html --site-dir _site
          python3 -m silastron_pulse build-static-cve-pages --published-dir _site/data --site-dir _site --base-url https://pulse.silastron.com
          python3 -m silastron_pulse validate _site/data/manifest.json
          python3 -m silastron_pulse validate _site/data/latest.json
          python3 -m silastron_pulse validate _site/data/verification-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path("_site/data/latest.json").read_text())
          published = json.loads(Path("pulse-state/published/latest.json").read_text())
          if latest.get("snapshot_id") != published.get("snapshot_id"):
              raise SystemExit("Status-only publish must not replace the published snapshot")
          status = json.loads(Path("_site/data/verification-status.json").read_text())
          if status.get("kind") != "verification_status":
              raise SystemExit("verification-status kind is invalid")
          print("status-only site built")
          PY

      - name: Upload Pages artifact
        if: >
          steps.decide.outputs.decision == 'publish' ||
          (steps.decide.outputs.decision == 'skip' && steps.decide.outputs.status_publish == 'yes')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Upload published state snapshot
        if: steps.decide.outputs.decision == 'publish'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-published
          path: _site/data
          if-no-files-found: error
          retention-days: 14

  record-publication-intent:
    name: Record publication intent
    needs: build
    if: needs.build.outputs.decision == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Checkout pulse-state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: pulse-state
          path: pulse-state

      - name: Persist intent before Pages deploy
        env:
          PYTHONPATH: src
          SNAPSHOT_ID: ${{ needs.build.outputs.snapshot_id }}
          COLLECT_RUN_ID: ${{ needs.build.outputs.collect_run_id }}
          DIGEST: ${{ needs.build.outputs.digest }}
          DEPLOYMENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          previous=""
          if [ -f pulse-state/published/latest.json ]; then
            previous="$(python3 -c 'import json; print(json.load(open("pulse-state/published/latest.json")).get("snapshot_id") or "")')"
          fi
          python3 -m silastron_pulse write-publication-intent \
            --published-dir pulse-state/published \
            --snapshot-id "${SNAPSHOT_ID}" \
            --collect-run-id "${COLLECT_RUN_ID}" \
            --candidate-digest "${DIGEST}" \
            --deployment-run-id "${DEPLOYMENT_RUN_ID}" \
            --expected-previous-snapshot-id "${previous}" \
            --state pending_deploy
          python3 -m silastron_pulse write-publication-status \
            --published-dir pulse-state/published \
            --state pending_deploy \
            --classification intent_recorded_pending_deploy \
            --snapshot-id "${SNAPSHOT_ID}" \
            --collect-run-id "${COLLECT_RUN_ID}" \
            --deployment-run-id "${DEPLOYMENT_RUN_ID}" \
            --manifest-digest "${DIGEST}" \
            --note "Intent recorded before Pages deploy. A successful deploy-pages job is not proof the CDN serves this snapshot."
          python3 -m silastron_pulse verify-publication-intent \
            --published-dir pulse-state/published \
            --snapshot-id "${SNAPSHOT_ID}" \
            --collect-run-id "${COLLECT_RUN_ID}" \
            --candidate-digest "${DIGEST}"
          cd pulse-state
          git add published/publication-intent.json published/publication-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "publication-intent ${SNAPSHOT_ID}"
          git push origin HEAD:pulse-state

  deploy:
    name: Deploy Pages
    needs: [build, record-publication-intent]
    if: needs.build.outputs.decision == 'publish' && needs.record-publication-intent.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  record-deploy-receipt:
    name: Record deploy receipt
    needs: [build, deploy]
    if: needs.build.outputs.decision == 'publish' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Checkout pulse-state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: pulse-state
          path: pulse-state

      - name: Record deployed-unpersisted receipt
        env:
          PYTHONPATH: src
          SNAPSHOT_ID: ${{ needs.build.outputs.snapshot_id }}
          COLLECT_RUN_ID: ${{ needs.build.outputs.collect_run_id }}
          DIGEST: ${{ needs.build.outputs.digest }}
          DEPLOYMENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -m silastron_pulse write-publication-status \
            --published-dir pulse-state/published \
            --state deployed_unpersisted \
            --classification deployment_succeeded_persist_failed \
            --snapshot-id "${SNAPSHOT_ID}" \
            --collect-run-id "${COLLECT_RUN_ID}" \
            --deployment-run-id "${DEPLOYMENT_RUN_ID}" \
            --manifest-digest "${DIGEST}" \
            --note "GitHub Pages deploy succeeded. pulse-state published/ has not yet been persisted. GitHub Pages cannot update atomically with the state branch."
          cd pulse-state
          git add published/publication-status.json
          if git diff --cached --quiet; then
            echo "Deploy receipt already recorded."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy-receipt ${SNAPSHOT_ID}"
          git push origin HEAD:pulse-state

  persist-published:
    name: Persist published snapshot to pulse-state
    needs: [build, deploy, record-deploy-receipt]
    if: ${{ always() && needs.build.outputs.decision == 'publish' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Checkout pulse-state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: pulse-state
          path: pulse-state

      - name: Download published data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-published
          path: published-data

      - name: Observe public Pages manifest
        env:
          PYTHONPATH: src
          SNAPSHOT_ID: ${{ needs.build.outputs.snapshot_id }}
          PULSE_PAGES_MANIFEST_URL: https://pulse.silastron.com/data/manifest.json
        run: |
          set -euo pipefail
          python3 -m silastron_pulse observe-pages-manifest \
            --url "${PULSE_PAGES_MANIFEST_URL}" \
            --expected-snapshot-id "${SNAPSHOT_ID}" \
            --attempts 3 > /tmp/pages-observe.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("/tmp/pages-observe.json")
          payload = json.loads(path.read_text()) if path.exists() and path.stat().st_size else {"status": "unconfirmed"}
          print(json.dumps(payload, indent=2))
          PY

      - name: Verify publication transition
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 -m silastron_pulse verify-publication \
            --incoming published-data \
            --current pulse-state/published

      - name: Commit published snapshot
        env:
          PYTHONPATH: src
          SNAPSHOT_ID: ${{ needs.build.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          python3 -m silastron_pulse safe-copy \
            --src published-data \
            --dst pulse-state/published
          python3 -m silastron_pulse write-publication-status \
            --published-dir pulse-state/published \
            --state consistent \
            --classification persistence_succeeded_and_consistent \
            --snapshot-id "${SNAPSHOT_ID}" \
            --collect-run-id "${{ needs.build.outputs.collect_run_id }}" \
            --deployment-run-id "${{ github.run_id }}" \
            --manifest-digest "${{ needs.build.outputs.digest }}" \
            --persisted-snapshot-id "${SNAPSHOT_ID}" \
            --persisted-manifest-digest "${{ needs.build.outputs.digest }}" \
            --note "Persistence succeeded and matches the deployed snapshot. GitHub Pages deploy and pulse-state persist are still not atomic."
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          snapshot_id = os.environ.get("SNAPSHOT_ID", "")
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,128}", snapshot_id):
              raise SystemExit("snapshot_id is not a safe commit token")
          Path("/tmp/publish-commit-msg").write_text(f"publish {snapshot_id}\n", encoding="utf-8")
          PY
          cd pulse-state
          git add published
          if git diff --cached --quiet; then
            echo "Published state already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -F /tmp/publish-commit-msg
          git push origin HEAD:pulse-state

  mark-deploy-failed:
    name: Mark failed or skipped Pages deploy
    needs: [build, record-publication-intent, deploy]
    if: ${{ always() && needs.build.outputs.decision == 'publish' && needs.record-publication-intent.result == 'success' && needs.deploy.result != 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Checkout pulse-state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: pulse-state
          path: pulse-state
      - name: Record failed deploy without locking later publication
        env:
          PYTHONPATH: src
          SNAPSHOT_ID: ${{ needs.build.outputs.snapshot_id }}
          COLLECT_RUN_ID: ${{ needs.build.outputs.collect_run_id }}
          DIGEST: ${{ needs.build.outputs.digest }}
          DEPLOYMENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -m silastron_pulse write-publication-status \
            --published-dir pulse-state/published \
            --state failed \
            --classification deployment_failed_before_publication \
            --snapshot-id "${SNAPSHOT_ID}" \
            --collect-run-id "${COLLECT_RUN_ID}" \
            --deployment-run-id "${DEPLOYMENT_RUN_ID}" \
            --manifest-digest "${DIGEST}" \
            --note "Pages deploy did not succeed after intent was recorded. This is not a permanent lock. The previous published snapshot remains the publication baseline."
          cd pulse-state
          git add published/publication-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy-failed ${SNAPSHOT_ID}"
          git push origin HEAD:pulse-state

  record-divergence:
    name: Record unresolved deploy/persist divergence
    needs: [build, deploy, persist-published]
    if: ${{ always() && needs.build.outputs.decision == 'publish' && needs.deploy.result == 'success' && needs.persist-published.result != 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Checkout pulse-state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: pulse-state
          path: pulse-state

      - name: Write blocking reconciliation state
        env:
          PYTHONPATH: src
          SNAPSHOT_ID: ${{ needs.build.outputs.snapshot_id }}
          COLLECT_RUN_ID: ${{ needs.build.outputs.collect_run_id }}
          DIGEST: ${{ needs.build.outputs.digest }}
          DEPLOYMENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -m silastron_pulse write-publication-status \
            --published-dir pulse-state/published \
            --state deployed_unpersisted \
            --classification deployment_succeeded_persist_failed \
            --snapshot-id "${SNAPSHOT_ID}" \
            --collect-run-id "${COLLECT_RUN_ID}" \
            --deployment-run-id "${DEPLOYMENT_RUN_ID}" \
            --manifest-digest "${DIGEST}" \
            --note "Backstop receipt: Pages deploy succeeded and persist did not. Further automated publication is blocked until reconcile-publication verifies the original artifact."
          cd pulse-state
          git add published/publication-status.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "divergence ${SNAPSHOT_ID}"
            git push origin HEAD:pulse-state
          fi
          {
            echo "## Pages and pulse-state have diverged"
            echo
            echo "GitHub Pages deploy succeeded, but \`pulse-state\` \`published/\` was not persisted."
            echo "GitHub Pages cannot be updated atomically with the state branch."
            echo
            echo "- Collect run ID: \`${COLLECT_RUN_ID}\`"
            echo "- Snapshot ID: \`${SNAPSHOT_ID}\`"
            echo "- Manifest digest: \`${DIGEST}\`"
            echo "- Deployment run: \`${DEPLOYMENT_RUN_ID}\`"
            echo
            echo "Further automated publication is blocked until reconciliation succeeds."
            echo
            echo "Operator recovery:"
            echo "1. Do not dispatch Deploy frontend."
            echo "2. Re-run the failed \`persist-published\` job on this workflow run, or"
            echo "3. Run \`silastron-pulse reconcile-publication --confirm RECONCILE --incoming <pulse-published> --current pulse-state/published --expected-snapshot-id ${SNAPSHOT_ID} --expected-digest ${DIGEST} --expected-collect-run-id ${COLLECT_RUN_ID}\`."
            echo
            echo "Recovery verifies the original validated artifact before repairing state. It never overwrites a different published/latest or deletes immutable snapshots."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  deploy-status:
    name: Deploy verification status only
    needs: build
    if: needs.build.outputs.decision == 'skip' && needs.build.outputs.status_publish == 'yes'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  persist-status:
    name: Persist verification status
    needs: [build, deploy-status]
    if: ${{ always() && needs.build.outputs.decision == 'skip' && needs.build.outputs.status_publish == 'yes' && needs.deploy-status.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Checkout pulse-state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: pulse-state
          path: pulse-state
      - name: Download collect artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-candidate
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ needs.build.outputs.collect_run_id }}
      - name: Persist verification-status without changing snapshots
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 -m silastron_pulse verify-publication-status \
            --published-dir pulse-state/published \
            --require consistent
          python3 -m silastron_pulse write-verification-status \
            --candidate dist/candidate.json \
            --published-dir pulse-state/published \
            --decision skip \
            --reason "${{ needs.build.outputs.reason }}" \
            --collect-run-id "${{ needs.build.outputs.collect_run_id }}" \
            --candidate-digest "${{ needs.build.outputs.digest }}" \
            --output pulse-state/published/verification-status.json
          python3 -m silastron_pulse validate pulse-state/published/verification-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path("pulse-state/published/latest.json").read_text())
          print(latest.get("snapshot_id"))
          PY
          cd pulse-state
          git add published/verification-status.json
          if git diff --cached --quiet; then
            echo "Verification status already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "verification-status ${{ needs.build.outputs.collect_run_id }}"
          git push origin HEAD:pulse-state

  # A failed scheduled Collect produces no candidate artifact, so nothing is
  # published. Without this the site keeps presenting the previous run's note
  # as if it were current. These jobs only annotate verification-status with
  # the failed attempt; snapshots and prior verification evidence are unchanged.
  build-failed-collect-status:
    name: Build failed-collect status
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.name == 'Collect' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Checkout publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Checkout pulse-state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: pulse-state
          path: pulse-state
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build site with failed attempt recorded
        env:
          PYTHONPATH: src
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ATTEMPTED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          python3 -m silastron_pulse verify-publication-status \
            --published-dir pulse-state/published \
            --require consistent
          mkdir -p _site/data
          python3 -m silastron_pulse safe-copy \
            --src pulse-state/published \
            --dst _site/data
          python3 -m silastron_pulse build-catalog-index --published-dir _site/data
          python3 -m silastron_pulse record-failed-collect \
            --published-dir _site/data \
            --collect-run-id "${RUN_ID}" \
            --conclusion "${CONCLUSION}" \
            --attempted-at "${ATTEMPTED_AT}"
          cp preview/styles.css preview/app.js preview/theme.js _site/
          python3 -m silastron_pulse build-home-page --published-dir _site/data --template preview/index.html --site-dir _site
          python3 -m silastron_pulse build-static-cve-pages --published-dir _site/data --site-dir _site --base-url https://pulse.silastron.com
          python3 -m silastron_pulse validate _site/data/manifest.json
          python3 -m silastron_pulse validate _site/data/latest.json
          python3 -m silastron_pulse validate _site/data/verification-status.json
          {
            echo "## Collect ${RUN_ID} ${CONCLUSION}"
            echo
            echo "Published snapshot is unchanged. verification-status now records the failed attempt."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy-failed-collect-status:
    name: Deploy failed-collect status
    needs: build-failed-collect-status
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  persist-failed-collect-status:
    name: Persist failed-collect status
    needs: deploy-failed-collect-status
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Checkout pulse-state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: pulse-state
          path: pulse-state
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Persist failed attempt without changing snapshots
        env:
          PYTHONPATH: src
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ATTEMPTED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          python3 -m silastron_pulse verify-publication-status \
            --published-dir pulse-state/published \
            --require consistent
          python3 -m silastron_pulse record-failed-collect \
            --published-dir pulse-state/published \
            --collect-run-id "${RUN_ID}" \
            --conclusion "${CONCLUSION}" \
            --attempted-at "${ATTEMPTED_AT}"
          python3 -m silastron_pulse validate pulse-state/published/verification-status.json
          cd pulse-state
          git add published/verification-status.json
          if git diff --cached --quiet; then
            echo "Failed attempt already recorded."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "verification-status failed collect ${RUN_ID}"
          git push origin HEAD:pulse-state
