name: Publish GitHub Pages

run-name: ${{ github.event_name == 'workflow_run' && format('Auto-publish Collect {0}', github.event.workflow_run.id) || format('Publish Collect {0}', github.event.inputs.collect_run_id) }}

# Manual dispatch remains the explicit fallback. Automated publication is
# event-driven from a successful scheduled Collect run and is bound to that
# run ID. This workflow never selects "the latest" candidate.

on:
  workflow_run:
    workflows: ["Collect"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to deploy the selected collect artifact
        required: true
        type: string
      collect_run_id:
        description: GitHub Actions run ID of a successful Collect workflow
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  note-ineligible-auto-publish:
    name: Note ineligible auto-publish
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'workflow_run' &&
      (
        github.event.workflow_run.conclusion != 'success' ||
        github.event.workflow_run.event != 'schedule' ||
        github.event.workflow_run.head_branch != 'main' ||
        github.event.workflow_run.name != 'Collect' ||
        github.event.workflow_run.head_repository.full_name != github.repository
      )
    steps:
      - name: Write trigger summary
        run: |
          {
            echo "## Auto-publish skipped"
            echo
            echo "- Collect run ID: \`${{ github.event.workflow_run.id }}\`"
            echo "- Collect event: \`${{ github.event.workflow_run.event }}\`"
            echo "- Conclusion: \`${{ github.event.workflow_run.conclusion }}\`"
            echo "- Branch: \`${{ github.event.workflow_run.head_branch }}\`"
            echo "- Head repository: \`${{ github.event.workflow_run.head_repository.full_name }}\`"
            echo
            echo "Automated publication only follows a successful scheduled Collect on main in this repository."
            echo "Manual Collect remains a candidate until Publish is dispatched with this run ID."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Pages artifact
    runs-on: ubuntu-24.04
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.event.inputs.confirm == 'PUBLISH'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.name == 'Collect' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
      reason: ${{ steps.decide.outputs.reason }}
      digest: ${{ steps.decide.outputs.digest }}
      snapshot_id: ${{ steps.decide.outputs.snapshot_id }}
      collect_run_id: ${{ steps.decide.outputs.collect_run_id }}
    steps:
      - name: Checkout publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Checkout pulse-state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: pulse-state
          path: pulse-state
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify collect run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.collect_run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "${RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "collect_run_id must be a numeric GitHub Actions run id"
            exit 1
          fi
          gh api "repos/${REPO}/actions/runs/${RUN_ID}" > /tmp/collect-run.json
          gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" > /tmp/collect-artifacts.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path("/tmp/collect-run.json").read_text())
          expected = os.environ["RUN_ID"]
          if str(run.get("id")) != expected:
              raise SystemExit(f"Fetched run id {run.get('id')!r} is not {expected}")
          repo = (run.get("repository") or {}).get("full_name") if isinstance(run.get("repository"), dict) else None
          if repo and repo != os.environ["REPO"]:
              raise SystemExit(f"Collect run repository {repo!r} is not {os.environ['REPO']}")
          artifacts = json.loads(Path("/tmp/collect-artifacts.json").read_text())
          items = artifacts.get("artifacts") or []
          pulse = next((item for item in items if item.get("name") == "pulse-candidate"), None)
          Path("/tmp/collect-artifact.json").write_text(json.dumps(pulse or {}))
          print(json.dumps({"id": run.get("id"), "path": run.get("path"), "head_sha": run.get("head_sha"), "event": run.get("event"), "conclusion": run.get("conclusion")}, indent=2))
          PY

      - name: Download collect artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-candidate
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || github.event.inputs.collect_run_id }}

      - name: Decide publication
        id: decide
        env:
          PYTHONPATH: src
          REPO: ${{ github.repository }}
          PUBLISH_MODE: ${{ github.event_name == 'workflow_run' && 'auto' || 'manual' }}
          RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.collect_run_id }}
          EXPECTED_EVENT: ${{ github.event_name == 'workflow_run' && 'schedule' || '' }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # artifact.digest is the GitHub zip-archive SHA-256, not candidate.json.
          python -m silastron_pulse verify-artifact-dir --path dist
          python -m silastron_pulse decide-publication \
            --mode "${PUBLISH_MODE}" \
            --run-json /tmp/collect-run.json \
            --artifact-json /tmp/collect-artifact.json \
            --candidate dist/candidate.json \
            --metadata-json dist/candidate.meta.json \
            --sha256sums dist/SHA256SUMS \
            --kev-catalog dist/source-kev-catalog.json \
            --kev-meta dist/source-kev-meta.json \
            --published-dir pulse-state/published \
            --expected-repository "${REPO}" \
            --expected-branch main \
            --expected-run-id "${RUN_ID}" \
            --expected-event "${EXPECTED_EVENT}" \
            --expected-head-sha "${EXPECTED_HEAD_SHA}" \
            --artifact-dir dist \
            --github-output "${GITHUB_OUTPUT}" \
            --summary-path "${GITHUB_STEP_SUMMARY}"

      - name: Promote snapshot into site data
        if: steps.decide.outputs.decision == 'publish'
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m silastron_pulse validate dist/candidate.json
          mkdir -p _site/data
          if [ -f pulse-state/published/latest.json ]; then
            python -m silastron_pulse safe-copy \
              --src pulse-state/published \
              --dst _site/data
          fi
          python -m silastron_pulse promote \
            --candidate dist/candidate.json \
            --published-dir _site/data \
            --expected-digest "${{ steps.decide.outputs.digest }}" \
            --expected-collector-sha "$(python -c 'import json; print(json.load(open("/tmp/collect-run.json"))["head_sha"])')"
          cp preview/index.html preview/styles.css preview/app.js preview/theme.js _site/
          python -m silastron_pulse validate _site/data/manifest.json
          python -m silastron_pulse validate _site/data/latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("_site/data/manifest.json").read_text())
          if manifest.get("status") not in {"ok", "degraded"}:
              raise SystemExit("Refusing to publish a non-ok snapshot")
          if not Path("_site/data/latest.json").exists():
              raise SystemExit("latest.json missing")
          PY

      - name: Upload Pages artifact
        if: steps.decide.outputs.decision == 'publish'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Upload published state snapshot
        if: steps.decide.outputs.decision == 'publish'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-published
          path: _site/data
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy Pages
    needs: build
    if: needs.build.outputs.decision == 'publish'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  persist-published:
    name: Persist published snapshot to pulse-state
    needs: [build, deploy]
    if: needs.build.outputs.decision == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout publisher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Checkout pulse-state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: pulse-state
          path: pulse-state

      - name: Download published data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-published
          path: published-data

      - name: Verify publication transition
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python3 -m silastron_pulse verify-publication \
            --incoming published-data \
            --current pulse-state/published

      - name: Commit published snapshot
        env:
          PYTHONPATH: src
          SNAPSHOT_ID: ${{ needs.build.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          python3 -m silastron_pulse safe-copy \
            --src published-data \
            --dst pulse-state/published
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          snapshot_id = os.environ.get("SNAPSHOT_ID", "")
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,128}", snapshot_id):
              raise SystemExit("snapshot_id is not a safe commit token")
          Path("/tmp/publish-commit-msg").write_text(f"publish {snapshot_id}\n", encoding="utf-8")
          PY
          cd pulse-state
          git add published
          if git diff --cached --quiet; then
            echo "Published state already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -F /tmp/publish-commit-msg
          git push origin HEAD:pulse-state

  warn-pages-state-divergence:
    name: Warn if Pages deployed without persisted state
    needs: [build, deploy, persist-published]
    if: ${{ always() && needs.build.outputs.decision == 'publish' && needs.deploy.result == 'success' && needs.persist-published.result != 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Record reconciliation procedure
        run: |
          {
            echo "## Pages and pulse-state may have diverged"
            echo
            echo "GitHub Pages deploy succeeded, but \`pulse-state\` \`published/\` was not persisted."
            echo "GitHub Pages cannot be updated atomically with the state branch."
            echo
            echo "Reconcile before the next frontend deploy:"
            echo "1. Re-run the failed \`persist-published\` job on this workflow run, or"
            echo "2. Dispatch Publish with the same Collect run ID."
            echo
            echo "Do not run Deploy frontend until persist succeeds; it copies the older pulse-state snapshot onto Pages."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
