name: Publish GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to deploy the latest successful collect artifact
        required: true
        type: string
      collect_run_id:
        description: Optional GitHub Actions run ID of a successful collect workflow
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'PUBLISH'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Resolve collect run
        id: collect_run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ github.event.inputs.collect_run_id }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_RUN_ID}" ]; then
            run_id="${INPUT_RUN_ID}"
          else
            run_id="$(gh run list --workflow collect.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
            echo "No successful collect run was found. Refusing to publish."
            exit 1
          fi
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download collect artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pulse-candidate
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.collect_run.outputs.run_id }}

      - name: Promote snapshot into site data
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m silastron_pulse validate dist/candidate.json
          mkdir -p _site/data
          python -m silastron_pulse promote --candidate dist/candidate.json --published-dir _site/data
          cp preview/index.html preview/styles.css preview/app.js _site/
          python -m silastron_pulse validate _site/data/manifest.json
          python -m silastron_pulse validate _site/data/latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("_site/data/manifest.json").read_text())
          if manifest.get("status") not in {"ok", "degraded"}:
              raise SystemExit("Refusing to publish a non-ok snapshot")
          if not Path("_site/data/latest.json").exists():
              raise SystemExit("latest.json missing")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
