name: Collect

on:
  workflow_dispatch:
  # Scheduled collection is intentionally not enabled.
  # Do not uncomment until source contracts and security review are approved.
  # schedule:
  #   - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: Collect candidate snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository_owner != ''
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Collect candidate
        env:
          PYTHONPATH: src
          PULSE_HTTP_TIMEOUT_SECONDS: "30"
          PULSE_MAX_REDIRECTS: "3"
          PULSE_CVE_WORKERS: "4"
        run: |
          mkdir -p dist
          python -m silastron_pulse collect --output-dir dist --previous public/data/latest.json || true
          python - <<'PY'
          import json, sys
          from pathlib import Path
          status = json.loads(Path("dist/collection-status.json").read_text())
          print(json.dumps(status, indent=2))
          if status.get("status") == "failed":
              sys.exit(1)
          PY

      - name: Validate candidate
        env:
          PYTHONPATH: src
        run: python -m silastron_pulse validate dist/candidate.json

      - name: Upload candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pulse-candidate
          path: |
            dist/candidate.json
            dist/collection-status.json
          if-no-files-found: error
          retention-days: 14
