name: Collect

# Daily candidate collection. This workflow never deploys Pages and never
# writes pulse-state published/. A successful scheduled run is the only
# event that may start automated Publish, which still binds that exact
# run ID. Manual Collect still requires explicit Publish dispatch.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: Collect candidate snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    steps:
      - name: Checkout collector
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Checkout pulse-state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: pulse-state
          path: pulse-state

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Collect candidate
        env:
          PYTHONPATH: src
          PULSE_HTTP_TIMEOUT_SECONDS: "30"
          PULSE_MAX_REDIRECTS: "3"
          PULSE_CVE_WORKERS: "2"
          PULSE_HTTP_MAX_ATTEMPTS: "3"
        run: |
          set -euo pipefail
          mkdir -p dist
          python -m silastron_pulse collect \
            --output-dir dist \
            --state-dir pulse-state \
            --collector-sha "${GITHUB_SHA}"
          python - <<'PY'
          import json, sys
          from pathlib import Path
          status = json.loads(Path("dist/collection-status.json").read_text())
          print(json.dumps(status, indent=2))
          if status.get("status") == "failed":
              sys.exit(1)
          if not Path("dist/candidate.json").exists():
              sys.exit("candidate.json missing")
          if not Path("dist/candidate.meta.json").exists():
              sys.exit("candidate.meta.json missing")
          PY

      - name: Validate candidate
        env:
          PYTHONPATH: src
        run: python -m silastron_pulse validate dist/candidate.json

      - name: Write digest
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from pathlib import Path
          from silastron_pulse.jsonutil import sha256_bytes
          body = Path("dist/candidate.json").read_bytes()
          digest = sha256_bytes(body)
          Path("dist/SHA256SUMS").write_text(f"{digest}  candidate.json\n", encoding="utf-8")
          print(digest)
          PY

      - name: Upload candidate artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-candidate
          path: |
            dist/candidate.json
            dist/candidate.meta.json
            dist/collection-status.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Persist source and candidate state
        run: |
          set -euo pipefail
          cd pulse-state
          if [ -d published ] && ! git diff --quiet -- published; then
            echo "Collect must not modify published/"
            git diff -- published
            exit 1
          fi
          git add source candidates
          if git diff --cached --name-only | grep -E '^published(/|$)'; then
            echo "Collect staged published/; refusing"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No pulse-state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "collect ${GITHUB_RUN_ID} ${GITHUB_SHA}"
          git push origin HEAD:pulse-state
