name: Collect

on:
  workflow_dispatch:
  # Scheduled collection is intentionally not enabled.
  # Do not uncomment until source contracts and security review are approved.
  # schedule:
  #   - cron: "17 6 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: Collect candidate snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout collector
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout pulse-state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: pulse-state
          path: pulse-state

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Collect candidate
        env:
          PYTHONPATH: src
          PULSE_HTTP_TIMEOUT_SECONDS: "30"
          PULSE_MAX_REDIRECTS: "3"
          PULSE_CVE_WORKERS: "2"
          PULSE_HTTP_MAX_ATTEMPTS: "3"
        run: |
          set -euo pipefail
          mkdir -p dist
          python -m silastron_pulse collect \
            --output-dir dist \
            --state-dir pulse-state \
            --collector-sha "${GITHUB_SHA}"
          python - <<'PY'
          import json, sys
          from pathlib import Path
          status = json.loads(Path("dist/collection-status.json").read_text())
          print(json.dumps(status, indent=2))
          if status.get("status") == "failed":
              sys.exit(1)
          if not Path("dist/candidate.json").exists():
              sys.exit("candidate.json missing")
          if not Path("dist/candidate.meta.json").exists():
              sys.exit("candidate.meta.json missing")
          PY

      - name: Validate candidate
        env:
          PYTHONPATH: src
        run: python -m silastron_pulse validate dist/candidate.json

      - name: Write digest
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from pathlib import Path
          from silastron_pulse.jsonutil import sha256_bytes
          body = Path("dist/candidate.json").read_bytes()
          digest = sha256_bytes(body)
          Path("dist/SHA256SUMS").write_text(f"{digest}  candidate.json\n", encoding="utf-8")
          print(digest)
          PY

      - name: Upload candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pulse-candidate
          path: |
            dist/candidate.json
            dist/candidate.meta.json
            dist/collection-status.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Persist source and candidate state
        run: |
          set -euo pipefail
          cd pulse-state
          git add source candidates
          if git diff --cached --quiet; then
            echo "No pulse-state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "collect ${GITHUB_RUN_ID} ${GITHUB_SHA}"
          git push origin HEAD:pulse-state
