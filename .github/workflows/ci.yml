name: CI

# Comment-only change to reindex GitHub Actions workflow files.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Validate unpublished preview documents
        env:
          PYTHONPATH: src
        run: |
          python -m silastron_pulse validate preview/data/manifest.json
          python -m silastron_pulse validate public/data/manifest.json
          python -c "import json,pathlib; json.loads(pathlib.Path('schemas/pulse-snapshot.v1.schema.json').read_text()); json.loads(pathlib.Path('schemas/pulse-manifest.v1.schema.json').read_text())"

  e2e:
    name: Browser explorer
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Playwright and Chromium
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser tests against local fixtures
        working-directory: tests/e2e
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: npx playwright test

  site-files:
    name: Feeds, sitemap and size budget
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the feed and sitemap validators
        run: python -m pip install -r requirements-feed-check.lock

      - name: Build the fixture site
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: python tests/e2e/serve.py --out "${RUNNER_TEMP}/fixture-site" --build-only

      - name: Validate Atom feeds (RFC 4287) and sitemap (sitemaps.org)
        run: python .github/scripts/validate_site_files.py "${RUNNER_TEMP}/fixture-site"

      - name: Check the size budget
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m silastron_pulse check-site-budget --site-dir "${RUNNER_TEMP}/fixture-site"
