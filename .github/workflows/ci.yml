name: CI

# Comment-only change to reindex GitHub Actions workflow files.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Validate unpublished preview documents
        env:
          PYTHONPATH: src
        run: |
          python -m silastron_pulse validate preview/data/manifest.json
          python -m silastron_pulse validate public/data/manifest.json
          python -c "import json,pathlib; json.loads(pathlib.Path('schemas/pulse-snapshot.v1.schema.json').read_text()); json.loads(pathlib.Path('schemas/pulse-manifest.v1.schema.json').read_text())"
