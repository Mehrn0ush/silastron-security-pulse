name: CI

# Comment-only change to reindex GitHub Actions workflow files.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Validate unpublished preview documents
        env:
          PYTHONPATH: src
        run: |
          python -m silastron_pulse validate preview/data/manifest.json
          python -m silastron_pulse validate public/data/manifest.json
          python -c "import json,pathlib; json.loads(pathlib.Path('schemas/pulse-snapshot.v1.schema.json').read_text()); json.loads(pathlib.Path('schemas/pulse-manifest.v1.schema.json').read_text())"
